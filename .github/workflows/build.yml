name: ZEIA Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  android:
    name: android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable

      - name: Create Android platform
        run: flutter create --platforms=android .

      - name: Configure Android background audio
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if "android.permission.FOREGROUND_SERVICE" not in s:
              s = s.replace(
                  "<manifest",
                  '<manifest xmlns:tools="http://schemas.android.com/tools"',
                  1
              )

              s = s.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n'
                  '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n'
                  '<application',
                  1
              )

          p.write_text(s)
          PY

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Android
        run: flutter build apk --release

      - name: Upload Android
        uses: actions/upload-artifact@v4
        with:
          name: ZEIA-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  macos:
    name: macos
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable

      - name: Create macOS platform
        run: flutter create --platforms=macos .

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Package macOS
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/zeia.app \
            ZEIA-macOS.zip

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: ZEIA-macOS
          path: ZEIA-macOS.zip

  windows:
    name: windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable

      - name: Create Windows platform
        run: flutter create --platforms=windows .

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows
        shell: pwsh
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      - name: Package Windows
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath ZEIA-Windows.zip

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: ZEIA-Windows
          path: ZEIA-Windows.zip

  ios:
    name: ios
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable

      - name: Create iOS platform
        run: flutter create --platforms=ios .

      - name: Enable iOS background audio
        shell: bash
        run: |
          /usr/libexec/PlistBuddy \
            -c "Add :UIBackgroundModes array" \
            ios/Runner/Info.plist 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :UIBackgroundModes:0 string audio" \
            ios/Runner/Info.plist 2>/dev/null || true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS simulator
        run: flutter build ios --simulator

      - name: Package iOS simulator
        run: |
          mkdir -p ios-artifact
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphonesimulator/Runner.app \
            ios-artifact/ZEIA-iOS-Simulator.zip

      - name: Upload iOS simulator
        uses: actions/upload-artifact@v4
        with:
          name: ZEIA-iOS-Simulator
          path: ios-artifact/ZEIA-iOS-Simulator.zip
